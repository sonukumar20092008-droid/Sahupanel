<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Panel</title>
</head>
<body>
    <h1>सेवा का चयन करें</h1>
    <form id="orderForm">
        <label for="service">सेवा:</label>
        <select id="service" name="service" required>
            <option value="service1">सेवा 1</option>
            <option value="service2">सेवा 2</option>
            <option value="service3">सेवा 3</option>
        </select>

        <label for="url">URL: </label>
        <input type="url" id="url" name="url" required>

        <label for="quantity">मात्रा: </label>
        <input type="number" id="quantity" name="quantity" min="1" required>

        <button type="button" id="calculatePrice">कीमत की गणना करें</button>
        <div id="priceDisplay"></div>

        <button type="button" id="paymentModal">QR कोड भुगतान</button>
        <div id="qrCodeModal" style="display: none;">
            <h2>QR कोड भुगतान</h2>
            <img src="path/to/qr-code.png" alt="QR Code"/>
            <button type="button" onclick="closeModal()">बंद करें</button>
        </div>

        <button type="submit">व्हाट्सएप पर ऑर्डर करें</button>
    </form>

    <script>
        document.getElementById('calculatePrice').addEventListener('click', function() {
            // Price calculation logic here
            document.getElementById('priceDisplay').innerText = 'कुल कीमत: ₹100'; // example price
        });

        document.getElementById('paymentModal').addEventListener('click', function() {
            document.getElementById('qrCodeModal').style.display = 'block';
        });

        function closeModal() {
            document.getElementById('qrCodeModal').style.display = 'none';
        }
    </script>
</body>
</html>
