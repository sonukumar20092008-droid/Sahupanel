<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Page</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/0.4.1/html2canvas.min.js"></script>
    <!-- Include QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.qrcode/1.0/jquery.qrcode.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <button id="sendOrder">Send Order</button>
    <div id="qrModal" style="display: none;">
        <div style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 20px; border: 1px solid black; background-color: white; z-index: 1000;">
            <h2>Payment QR Code</h2>
            <div id="qrCode"></div>
            <button id="closeModal">Close</button>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            $('#sendOrder').click(function() {
                // Show QR code modal
                var upiLink = 'upi:917250728059@oksbi'; // Replace with your UPI link
                $('#qrCode').empty().qrcode(upiLink);
                $('#qrModal').show();
            });

            $('#closeModal').click(function() {
                $('#qrModal').hide();
            });
        });

        function sendToWhatsApp() {
            var message = 'Order details...'; // Your order details
            var number = '917250728059'; // WhatsApp number
            var encodedMessage = encodeURIComponent(message);
            window.open('https://api.whatsapp.com/send?phone=' + number + '&text=' + encodedMessage);
        }
    </script>
    <style>
        /* Modal styles */
        #qrModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); }
    </style>
</body>
</html>
